name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          go install github.com/magefile/mage@latest
          go mod download

      - name: Build Windows
        run: mage windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          go install github.com/magefile/mage@latest
          go mod download

      - name: Build macOS
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mage macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/*.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          go install github.com/magefile/mage@latest
          go mod download
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Build Linux
        run: mage linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: release/*.tar.gz

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          go install github.com/magefile/mage@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          go mod download

      - name: Build Android AAR
        run: mage android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            android/app/libs/*.aar
            android/app/build/outputs/apk/release/*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-build/*
            artifacts/macos-build/*
            artifacts/linux-build/*
            artifacts/android-build/*.apk
          body: |
            ## 🎉 OLC VPN Client Release

            Cross-platform VPN client with sing-box and olcrtc engines.

            ### ✨ Features
            - **sing-box engine**: VLESS+Reality, Shadowsocks, Trojan, VMess, Hysteria2
            - **olcrtc engine**: WebRTC tunnel via Russian white services (WB Stream, Jazz, Telemost)
            - **Windows**: Desktop GUI with Fyne
            - **macOS**: Universal Binary (Intel + Apple Silicon)
            - **Linux**: Desktop GUI
            - **Android**: Native app with Kotlin/Compose
            - **iOS**: Build from source (see BUILD.md)
            - **Subscription support**: 4 formats (Base64, Clash, sing-box, olcrtc)
            - **Security**: SOCKS5 with authentication, encrypted profile storage

            ### 📦 Downloads
            - **Windows**: `olcvpn-windows-amd64.zip`
            - **macOS**: `olcvpn-macos-universal.zip`
            - **Linux**: `olcvpn-linux-amd64.tar.gz`
            - **Android**: `olcvpn-android.apk`

            ### 📚 Documentation
            - [Build Instructions](BUILD.md)
            - [Architecture & Guidelines](CLAUDE.md)
            - [GitHub Repository](https://github.com/yanisplugg/olcvpn-client)

            ### 🔒 Security Notes
            - SOCKS5 proxy requires authentication (fixes per-app split bypass vulnerability)
            - Profile secrets encrypted with system keyring
            - No plaintext credentials in storage

            ---

            **Source code** is automatically included by GitHub (zip/tar.gz).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
